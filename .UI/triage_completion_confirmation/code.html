<html class="dark"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;500;600&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #151311;
            -webkit-font-smoothing: antialiased;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "surface-variant": "#373432",
                      "surface-container-lowest": "#100e0c",
                      "on-secondary": "#2b331e",
                      "surface-container": "#211f1d",
                      "on-secondary-fixed": "#161e0a",
                      "on-error-container": "#ffdad6",
                      "inverse-primary": "#9d422e",
                      "surface": "#151311",
                      "error": "#ffb4ab",
                      "on-error": "#690005",
                      "tertiary": "#e9c176",
                      "surface-tint": "#ffb4a4",
                      "primary": "#ffb4a4",
                      "surface-container-high": "#2c2927",
                      "on-tertiary-fixed": "#261900",
                      "on-tertiary": "#412d00",
                      "on-primary-fixed-variant": "#7e2b19",
                      "tertiary-fixed": "#ffdea5",
                      "tertiary-container": "#af8b47",
                      "primary-fixed-dim": "#ffb4a4",
                      "on-surface-variant": "#dcc0bb",
                      "error-container": "#93000a",
                      "on-secondary-container": "#b2bc9e",
                      "inverse-surface": "#e7e1de",
                      "surface-container-highest": "#373432",
                      "on-primary-container": "#560d01",
                      "background": "#151311",
                      "surface-dim": "#151311",
                      "primary-container": "#dd725a",
                      "on-primary-fixed": "#3d0500",
                      "outline-variant": "#56423e",
                      "on-background": "#e7e1de",
                      "on-tertiary-fixed-variant": "#5d4201",
                      "on-secondary-fixed-variant": "#414a33",
                      "surface-container-low": "#1d1b19",
                      "secondary-container": "#434c35",
                      "secondary-fixed": "#dce7c7",
                      "primary-fixed": "#ffdad3",
                      "secondary-fixed-dim": "#c0caac",
                      "secondary": "#c0caac",
                      "on-tertiary-container": "#382700",
                      "on-surface": "#e7e1de",
                      "surface-bright": "#3b3936",
                      "outline": "#a48b86",
                      "inverse-on-surface": "#32302e",
                      "tertiary-fixed-dim": "#e9c176",
                      "on-primary": "#5f1505"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "unit": "4px",
                      "stack-lg": "32px",
                      "margin-mobile": "24px",
                      "gutter-mobile": "16px",
                      "stack-sm": "8px",
                      "stack-md": "16px"
              },
              "fontFamily": {
                      "headline-lg": ["Newsreader"],
                      "body-md": ["Inter"],
                      "body-lg": ["Inter"],
                      "label-md": ["Inter"],
                      "numbers": ["Inter"],
                      "headline-md": ["Newsreader"],
                      "display": ["Newsreader"]
              },
              "fontSize": {
                      "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "500"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                      "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                      "numbers": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "500"}],
                      "display": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600"}]
              }
            },
          },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center p-margin-mobile">
<!-- Confirmation Canvas: A full-screen modal-like container -->
<main class="w-full max-w-md flex flex-col items-center justify-center text-center">
<!-- Minimalist Indicator -->
<div class="mb-stack-lg opacity-40">
<span class="material-symbols-outlined text-primary" style="font-size: 48px; font-variation-settings: 'wght' 200;">
                done_all
            </span>
</div>
<!-- Central Confirmation Message -->
<div class="space-y-unit">
<h1 class="font-headline-lg text-headline-lg text-on-surface">
                Ready for the new week.
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px] mx-auto">
                Your ritual is complete. Your focus for the upcoming days has been anchored.
            </p>
</div>
<!-- Quiet Action: Auto-dismissal simulated via a low-priority button -->
<div class="mt-stack-lg pt-stack-lg">
<button class="font-label-md text-label-md text-primary opacity-60 hover:opacity-100 transition-opacity flex items-center gap-unit">
                Return to Focus
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</main>
<!-- Navigation suppressed per rules (Transactional/Confirmation state) -->
<!-- Subtle Texture/Atmosphere (Using Tailwind Gradients instead of images) -->
<div class="fixed inset-0 pointer-events-none z-[-1] opacity-20">
<div class="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-surface-variant via-transparent to-transparent"></div>
</div>
</body></html>
