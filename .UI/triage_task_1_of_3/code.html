<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Newsreader:opsz,wght@6..72,400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            background-color: #151311;
            -webkit-font-smoothing: antialiased;
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-variant": "#373432",
                    "surface-container-lowest": "#100e0c",
                    "on-secondary": "#2b331e",
                    "surface-container": "#211f1d",
                    "on-secondary-fixed": "#161e0a",
                    "on-error-container": "#ffdad6",
                    "inverse-primary": "#9d422e",
                    "surface": "#151311",
                    "error": "#ffb4ab",
                    "on-error": "#690005",
                    "tertiary": "#e9c176",
                    "surface-tint": "#ffb4a4",
                    "primary": "#ffb4a4",
                    "surface-container-high": "#2c2927",
                    "on-tertiary-fixed": "#261900",
                    "on-tertiary": "#412d00",
                    "on-primary-fixed-variant": "#7e2b19",
                    "tertiary-fixed": "#ffdea5",
                    "tertiary-container": "#af8b47",
                    "primary-fixed-dim": "#ffb4a4",
                    "on-surface-variant": "#dcc0bb",
                    "error-container": "#93000a",
                    "on-secondary-container": "#b2bc9e",
                    "inverse-surface": "#e7e1de",
                    "surface-container-highest": "#373432",
                    "on-primary-container": "#560d01",
                    "background": "#151311",
                    "surface-dim": "#151311",
                    "primary-container": "#dd725a",
                    "on-primary-fixed": "#3d0500",
                    "outline-variant": "#56423e",
                    "on-background": "#e7e1de",
                    "on-tertiary-fixed-variant": "#5d4201",
                    "on-secondary-fixed-variant": "#414a33",
                    "surface-container-low": "#1d1b19",
                    "secondary-container": "#434c35",
                    "secondary-fixed": "#dce7c7",
                    "primary-fixed": "#ffdad3",
                    "secondary-fixed-dim": "#c0caac",
                    "secondary": "#c0caac",
                    "on-tertiary-container": "#382700",
                    "on-surface": "#e7e1de",
                    "surface-bright": "#3b3936",
                    "outline": "#a48b86",
                    "inverse-on-surface": "#32302e",
                    "tertiary-fixed-dim": "#e9c176",
                    "on-primary": "#5f1505"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "unit": "4px",
                    "stack-lg": "32px",
                    "margin-mobile": "24px",
                    "gutter-mobile": "16px",
                    "stack-sm": "8px",
                    "stack-md": "16px"
            },
            "fontFamily": {
                    "headline-lg": ["Newsreader"],
                    "body-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "label-md": ["Inter"],
                    "numbers": ["Inter"],
                    "headline-md": ["Newsreader"],
                    "display": ["Newsreader"]
            },
            "fontSize": {
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "500"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                    "numbers": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "500"}],
                    "display": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col">
<!-- Header Section -->
<header class="w-full flex flex-col items-center pt-stack-lg px-margin-mobile">
<div class="w-full max-w-md flex flex-col items-center gap-stack-sm">
<h1 class="font-headline-md text-headline-md text-on-surface-variant text-center opacity-80">Last week's leftovers</h1>
<div class="flex items-center gap-stack-sm mt-stack-sm">
<span class="font-label-md text-label-md text-primary bg-primary/10 px-3 py-1 rounded-full">1 of 3</span>
</div>
</div>
</header>
<!-- Main Content: Triage Canvas -->
<main class="flex-grow flex items-center justify-center px-margin-mobile">
<div class="w-full max-w-md flex flex-col gap-stack-lg">
<!-- Focal Task Card -->
<div class="bg-surface-container rounded-xl p-stack-lg shadow-sm flex flex-col gap-stack-md transition-all duration-300">
<h2 class="font-headline-lg text-headline-lg text-on-surface leading-tight">Polish demo for Joy Eslava</h2>
<div class="flex flex-wrap gap-2 pt-2">
<!-- Theme Chip -->
<span class="bg-secondary/10 text-secondary font-label-md text-label-md px-3 py-1 rounded-full">
                        Music Production
                    </span>
<!-- Effort Chip -->
<span class="bg-on-surface-variant/10 text-on-surface-variant font-label-md text-label-md px-3 py-1 rounded-full flex items-center gap-1">
                        Low Effort
                    </span>
<!-- Return Chip -->
<span class="bg-tertiary/10 text-tertiary font-label-md text-label-md px-3 py-1 rounded-full">
                        High Return
                    </span>
</div>
</div>
<!-- Action Stack -->
<div class="flex flex-col gap-stack-md w-full">
<!-- Primary Action -->
<button class="bg-primary-container text-on-primary-container font-label-md text-label-md py-4 rounded-xl flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all">
<span class="material-symbols-outlined text-xl" data-icon="push_pin">push_pin</span>
                    Keep for this week
                </button>
<!-- Secondary Action -->
<button class="border border-outline-variant text-on-surface-variant font-label-md text-label-md py-4 rounded-xl flex items-center justify-center gap-2 hover:bg-surface-variant/30 active:scale-[0.98] transition-all">
<span class="material-symbols-outlined text-xl" data-icon="inventory_2">inventory_2</span>
                    Send to backlog
                </button>
<!-- Tertiary Action -->
<button class="text-on-surface-variant font-label-md text-label-md py-4 rounded-xl flex items-center justify-center gap-2 opacity-60 hover:opacity-100 transition-all">
<span class="material-symbols-outlined text-xl" data-icon="delete_sweep">delete_sweep</span>
                    Drop
                </button>
</div>
</div>
</main>
<!-- Navigation Shell Placeholder (Suppressed per "The Destination Rule" for Transactional Screens) -->
<!-- The BottomNavBar and TopAppBar are suppressed because this is a focused linear triage journey -->
<!-- Backdrop Decorative Detail (Quiet Aesthetic) -->
<div class="fixed inset-0 pointer-events-none z-[-1] overflow-hidden">
<div class="absolute top-[-10%] right-[-10%] w-[40%] h-[40%] bg-primary/5 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-5%] left-[-5%] w-[30%] h-[30%] bg-tertiary/5 blur-[100px] rounded-full"></div>
</div>
</body></html>
