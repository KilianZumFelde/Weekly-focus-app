<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&amp;family=Inter:wght@100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary-fixed-dim": "#ffb4a4",
                        "on-surface": "#e7e1de",
                        "primary": "#ffb4a4",
                        "inverse-surface": "#e7e1de",
                        "on-secondary": "#2b331e",
                        "inverse-on-surface": "#32302e",
                        "primary-fixed": "#ffdad3",
                        "on-tertiary-fixed": "#261900",
                        "surface": "#151311",
                        "on-error-container": "#ffdad6",
                        "surface-tint": "#ffb4a4",
                        "surface-container-low": "#1d1b19",
                        "secondary-container": "#434c35",
                        "on-tertiary-container": "#382700",
                        "on-primary-container": "#560d01",
                        "surface-container-lowest": "#100e0c",
                        "outline-variant": "#56423e",
                        "on-error": "#690005",
                        "error-container": "#93000a",
                        "surface-variant": "#373432",
                        "on-secondary-fixed": "#161e0a",
                        "inverse-primary": "#9d422e",
                        "on-primary-fixed": "#3d0500",
                        "secondary-fixed": "#dce7c7",
                        "on-primary": "#5f1505",
                        "tertiary": "#e9c176",
                        "secondary": "#c0caac",
                        "on-background": "#e7e1de",
                        "tertiary-fixed": "#ffdea5",
                        "tertiary-container": "#af8b47",
                        "on-tertiary-fixed-variant": "#5d4201",
                        "on-surface-variant": "#dcc0bb",
                        "tertiary-fixed-dim": "#e9c176",
                        "outline": "#a48b86",
                        "surface-container-highest": "#373432",
                        "surface-container": "#211f1d",
                        "on-tertiary": "#412d00",
                        "secondary-fixed-dim": "#c0caac",
                        "on-primary-fixed-variant": "#7e2b19",
                        "error": "#ffb4ab",
                        "on-secondary-container": "#b2bc9e",
                        "surface-dim": "#151311",
                        "primary-container": "#dd725a",
                        "on-secondary-fixed-variant": "#414a33",
                        "background": "#151311",
                        "surface-container-high": "#2c2927",
                        "surface-bright": "#3b3936"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "stack-sm": "8px",
                        "stack-md": "16px",
                        "stack-lg": "32px",
                        "margin-mobile": "24px",
                        "gutter-mobile": "16px"
                    },
                    "fontFamily": {
                        "numbers": ["Inter"],
                        "display": ["Newsreader"],
                        "body-md": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-md": ["Newsreader"],
                        "body-lg": ["Inter"],
                        "headline-lg": ["Newsreader"]
                    },
                    "fontSize": {
                        "numbers": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "display": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "500"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "500"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .scrim-overlay {
            background: rgba(21, 19, 17, 0.85);
            backdrop-filter: blur(4px);
        }
        .bottom-sheet {
            box-shadow: 0 -8px 40px rgba(26, 24, 22, 0.4);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen overflow-hidden">
<!-- Background View (This Week Screen - SCREEN_6) -->
<div aria-hidden="true" class="fixed inset-0 p-margin-mobile opacity-40 select-none pointer-events-none">
<header class="flex justify-between items-center mb-stack-lg">
<h1 class="font-display text-display text-primary">The Analog Digital</h1>
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-on-surface-variant">person</span>
</div>
</header>
<section class="space-y-stack-md">
<div class="h-24 w-full bg-surface-container rounded-xl"></div>
<div class="h-48 w-full bg-surface-container rounded-xl"></div>
<div class="h-32 w-full bg-surface-container rounded-xl"></div>
</section>
</div>
<!-- Scrim -->
<div class="fixed inset-0 scrim-overlay z-40"></div>
<!-- Bottom Sheet Container -->
<div class="fixed inset-x-0 bottom-0 z-50 flex flex-col items-center">
<!-- Bottom Sheet Content -->
<main class="bottom-sheet bg-surface-container-low w-full max-w-xl rounded-t-[32px] px-margin-mobile pb-12 pt-stack-sm flex flex-col">
<!-- Grab Handle -->
<div class="w-12 h-1 bg-outline-variant rounded-full self-center mb-stack-lg"></div>
<!-- Title & Metadata -->
<div class="mb-stack-lg">
<div class="flex items-center gap-stack-sm mb-unit">
<input class="bg-transparent border-none p-0 font-headline-lg text-headline-lg text-on-surface focus:ring-0 w-full" spellcheck="false" type="text" value="Gym"/>
</div>
<div class="flex flex-wrap gap-stack-sm">
<!-- Category Chip -->
<span class="inline-flex items-center px-3 py-1 rounded-full bg-secondary-container/20 text-on-secondary-container font-label-md text-label-md">
<span class="material-symbols-outlined text-[16px] mr-1">favorite</span>
                        Health
                    </span>
<!-- Goal Link Chip -->
<span class="inline-flex items-center px-3 py-1 rounded-full bg-surface-container-highest text-on-surface-variant font-label-md text-label-md">
<span class="material-symbols-outlined text-[16px] mr-1">link</span>
                        Land first paid gig...
                    </span>
</div>
</div>
<!-- Target Stepper Row -->
<div class="flex items-center justify-between py-stack-md">
<span class="font-body-lg text-body-lg text-on-surface-variant">4 per week</span>
<div class="flex items-center gap-stack-md bg-surface-container-high rounded-full px-2 py-1">
<button class="w-8 h-8 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined">remove</span>
</button>
<span class="font-numbers text-numbers text-on-surface w-4 text-center">4</span>
<button class="w-8 h-8 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>
<!-- THE STREAK BLOCK (Visual Centerpiece) -->
<div class="my-stack-lg py-stack-lg px-stack-md rounded-2xl bg-surface-container-highest/30 flex flex-col items-center justify-center space-y-unit text-center">
<div class="flex items-baseline gap-stack-sm">
<span class="font-display text-display text-primary">8</span>
<span class="font-headline-md text-headline-md text-on-surface-variant">weeks</span>
</div>
<div class="flex items-center gap-2">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Current Streak</span>
<span class="h-1 w-1 bg-outline-variant rounded-full"></span>
<span class="font-label-md text-label-md text-tertiary">Best: 12</span>
</div>
</div>
<hr class="border-outline-variant/30 mb-stack-lg"/>
<!-- Action Row -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-stack-md">
<span class="font-label-md text-label-md text-on-surface-variant">Pause Habit</span>
<button class="relative inline-flex h-6 w-11 flex-shrink-0 cursor-pointer rounded-full border-2 border-transparent bg-surface-variant transition-colors duration-200 ease-in-out focus:outline-none" role="switch">
<span class="translate-x-0 pointer-events-none inline-block h-5 w-5 transform rounded-full bg-on-surface-variant shadow ring-0 transition duration-200 ease-in-out"></span>
</button>
</div>
<button class="flex items-center gap-unit text-error font-label-md text-label-md hover:opacity-80 transition-opacity">
<span class="material-symbols-outlined text-[18px]">delete</span>
                    Delete
                </button>
</div>
</main>
</div>
<!-- Hidden Navigation (Suppressed per "The Destination Rule") -->
<!-- The BottomNavBar is excluded because this is a focused Detail/Edit task screen -->
</body></html>
