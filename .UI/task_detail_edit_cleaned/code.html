<!DOCTYPE html>

<html class="dark" lang="en" style=""><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-fixed-dim": "#e9c176",
                        "on-secondary-fixed": "#161e0a",
                        "secondary-fixed-dim": "#c0caac",
                        "surface-tint": "#ffb4a4",
                        "surface-dim": "#151311",
                        "surface-container-lowest": "#100e0c",
                        "secondary-fixed": "#dce7c7",
                        "secondary": "#c0caac",
                        "surface-container-high": "#2c2927",
                        "on-secondary": "#2b331e",
                        "surface-variant": "#373432",
                        "on-surface-variant": "#dcc0bb",
                        "tertiary-container": "#af8b47",
                        "surface-container-highest": "#373432",
                        "on-tertiary-fixed-variant": "#5d4201",
                        "inverse-on-surface": "#32302e",
                        "primary-fixed-dim": "#ffb4a4",
                        "on-surface": "#e7e1de",
                        "on-primary-fixed": "#3d0500",
                        "error-container": "#93000a",
                        "outline": "#a48b86",

                        "outline-variant": "#56423e",
                        "on-error-container": "#ffdad6",
                        "inverse-surface": "#e7e1de",

                        "on-tertiary-fixed": "#261900",

                        "on-primary": "#5f1505"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "gutter-mobile": "16px",
                        "stack-lg": "32px",
                        "stack-md": "16px",
                        "margin-mobile": "24px",
                        "stack-sm": "8px"
                    },
                    "fontFamily": {
                        "headline-md": ["Newsreader"],
                        "body-md": ["Inter"],
                        "display": ["Newsreader"],
                        "body-lg": ["Inter"],
                        "numbers": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Newsreader"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "500"}],
                        "headline-md-mobile": ["20px", {"lineHeight": "28px", "fontWeight": "500"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "display": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600"}],

                        "numbers": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],

                        "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "500"}],
                        "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "500"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
            font-size: 20px;
        }
        .scrim-blur {
            backdrop-filter: blur(4px);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes slide-up {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slide-up 0.3s cubic-bezier(0.2, 0, 0, 1) forwards;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col overflow-hidden">
<!-- Top App Bar -->
<header class="bg-surface/90 dark:bg-surface/90 backdrop-blur-xl text-primary fixed top-0 w-full z-50 shadow-sm shadow-surface-dim/5 flex items-center justify-between px-margin-mobile h-16">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary scale-95 active:scale-90 transition-transform cursor-pointer" data-icon="menu">menu</span>
<h1 class="font-display text-headline-md-mobile text-primary tracking-tight">The Analog Digital</h1>
</div>
<div class="w-8 h-8 rounded-full overflow-hidden border border-outline-variant bg-surface-container">
<img class="w-full h-full object-cover" data-alt="A professional close-up portrait of a creative individual" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCxYMNTFJnF21e7ZU0zKzc44-nEmkNHWNIeF1OetmarG-NctGDRNVhE7RR8jWlYQBJWhhnYCbvInFdcPBgGyLkChmrBmLq1XDKVvjDjA0pbcNdkymTveSRi6SGChf0FwXndHjsd5rrRXuIE6U-3nh0GfOAvzXX2lqPi2KxQip1IVFWbNzrT9GQnETv7rWi6gNjvtRPFNLa1jwW6cazS-E0PRIZSvRNjcOiFzLJtrccTDC4A3oGPoA4GcpaguOk2MzTKrxlpm2SKE5g"/>
</div>
</header>
<!-- Background Content -->
<main class="flex-1 pt-24 px-margin-mobile opacity-40 select-none pointer-events-none">
<div class="flex flex-col gap-stack-lg">
<section>
<h2 class="font-headline-md text-on-surface mb-stack-md">Current Focus</h2>
<div class="space-y-stack-md">
<div class="bg-surface-container rounded-xl p-stack-md flex items-center justify-between shadow-sm">
<div class="flex flex-col">
<span class="font-headline-md text-on-surface">Polish demo for Joy Eslava</span>
<span class="text-on-surface-variant font-label-md">Music Production • High Return</span>
</div>
<span class="material-symbols-outlined text-secondary" data-icon="radio_button_unchecked">radio_button_unchecked</span>
</div>
<div class="bg-surface-container rounded-xl p-stack-md flex items-center justify-between">
<div class="flex flex-col">
<span class="font-headline-md text-on-surface">Order studio monitors</span>
<span class="text-on-surface-variant font-label-md">Logistics • Low Effort</span>
</div>
<span class="material-symbols-outlined text-secondary" data-icon="radio_button_unchecked">radio_button_unchecked</span>
</div>
</div>
</section>
</div>
</main>
<!-- Bottom Navigation -->
<nav class="fixed bottom-6 left-margin-mobile right-margin-mobile rounded-xl z-50 overflow-hidden bg-surface-container/80 dark:bg-surface-container/80 backdrop-blur-2xl border-none shadow-xl flex justify-around items-center h-16 max-w-md mx-auto opacity-30">
<div class="flex flex-col items-center justify-center text-primary bg-primary/10 rounded-lg py-1 px-3">
<span class="material-symbols-outlined" data-icon="calendar_view_week">calendar_view_week</span>
<span class="font-label-md text-label-md">This Week</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant py-1 px-3">
<span class="material-symbols-outlined" data-icon="inventory_2">inventory_2</span>
<span class="font-label-md text-label-md">Backlog</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant py-1 px-3">
<span class="material-symbols-outlined" data-icon="target">target</span>
<span class="font-label-md text-label-md">Goals</span>
</div>
<div class="flex flex-col items-center justify-center text-on-surface-variant py-1 px-3">
<span class="material-symbols-outlined" data-icon="leaderboard">leaderboard</span>
<span class="font-label-md text-label-md">Stats</span>
</div>
</nav>
<!-- Scrim -->
<div class="fixed inset-0 bg-surface-dim/70 scrim-blur z-[60]"></div>
<!-- Task Detail Bottom Sheet -->
<div class="fixed bottom-0 left-0 right-0 z-[70] flex justify-center">
<div class="bg-surface-container w-full max-w-2xl rounded-t-[32px] shadow-2xl shadow-black/40 border-t border-white/5 pb-12 animate-slide-up">
<!-- Grab Handle -->
<div class="flex justify-center pt-3 pb-6">
<div class="w-12 h-1 bg-outline-variant/40 rounded-full"></div>
</div>
<!-- Editable Title -->
<div class="px-margin-mobile mb-stack-md">
<textarea class="w-full bg-transparent border-none p-0 text-on-surface font-headline-lg-mobile md:font-headline-lg focus:ring-0 resize-none min-h-[40px] font-display" placeholder="Task Title" rows="1">Polish demo for Joy Eslava</textarea>
</div>
<!-- Metadata Chips Row -->
<div class="flex gap-3 overflow-x-auto px-margin-mobile no-scrollbar mb-stack-lg">
<button class="flex-shrink-0 flex items-center gap-2 bg-secondary/10 text-secondary px-4 py-2 rounded-full font-label-md hover:bg-secondary/20 transition-colors">
<span class="material-symbols-outlined text-[18px]" data-icon="category">category</span>
                    Music Production
                </button>
<button class="flex-shrink-0 flex items-center gap-2 bg-tertiary/10 text-tertiary px-4 py-2 rounded-full font-label-md hover:bg-tertiary/20 transition-colors">
<span class="material-symbols-outlined text-[18px]" data-icon="bolt">bolt</span>
                    Low Effort
                </button>
<button class="flex-shrink-0 flex items-center gap-2 bg-primary/10 text-primary px-4 py-2 rounded-full font-label-md hover:bg-primary/20 transition-colors">
<span class="material-symbols-outlined text-[18px]" data-icon="trending_up">trending_up</span>
                    High Return
                </button>
<button class="flex-shrink-0 flex items-center gap-2 bg-surface-variant text-on-surface-variant px-4 py-2 rounded-full font-label-md hover:bg-outline-variant/20 transition-colors">
<span class="material-symbols-outlined text-[18px]" data-icon="calendar_today">calendar_today</span>
                    This Week
                </button>
<button class="flex-shrink-0 flex items-center gap-2 border border-outline-variant text-on-surface-variant px-4 py-2 rounded-full font-label-md hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-[18px]" data-icon="add_alert">add_alert</span>
                    Add reminder
                </button>
</div>
<div class="px-margin-mobile">
<hr class="border-outline-variant/20 mb-stack-md"/>
<!-- Action Row: Drop option removed -->
<div class="flex items-center justify-between">
<button class="text-on-surface-variant font-label-md hover:text-primary transition-colors flex items-center gap-2 py-2">
<span class="material-symbols-outlined text-[18px]" data-icon="inventory_2">inventory_2</span>
                        Move to backlog
                    </button>
<button class="text-primary font-label-md hover:bg-primary/10 transition-colors flex items-center gap-2 py-2 px-3 rounded-lg">
<span class="material-symbols-outlined text-[18px]" data-icon="delete">delete</span>
                        Delete
                    </button>
</div>
</div>
</div>
</div>
<!-- Floating Action Button (Background Screen Context) -->
<div class="fixed bottom-10 right-margin-mobile flex items-end gap-unit z-40 pointer-events-none opacity-20">
<button class="w-12 h-12 rounded-full bg-surface-variant text-on-surface-variant shadow-lg flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="add">add</span>
</button>
<button class="w-16 h-16 rounded-full bg-primary text-on-primary shadow-xl flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="mic" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
</body></html>
