<!DOCTYPE html>

<html class="dark"><head>
<meta charset="utf-8"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

            "surface-variant": "#373432",
            "surface-container-low": "#1d1b19",
            "on-tertiary-fixed": "#261900",
            "on-primary-container": "#560d01",
            "secondary-container": "#434c35",
            "outline": "#a48b86",
            "on-tertiary-container": "#382700",
            "inverse-primary": "#9d422e",

            "tertiary-fixed": "#ffdea5",
            "surface-tint": "#ffb4a4",
            "on-secondary-fixed-variant": "#414a33",
            "primary-fixed-dim": "#ffb4a4",
            "tertiary-fixed-dim": "#e9c176",
            "primary": "#ffb4a4",

          "borderRadius": {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          "spacing": {
            "unit": "4px",
            "stack-lg": "32px",
            "gutter-mobile": "16px",
            "stack-md": "16px",
            "stack-sm": "8px",
            "margin-mobile": "24px"
          },
          "fontFamily": {
            "display": ["Newsreader"],
            "body-md": ["Inter"],
            "numbers": ["Inter"],
            "headline-md": ["Newsreader"],
            "label-md": ["Inter"],

          "fontSize": {
            "display": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "600"}],

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style data-stitch-cursor="">*{cursor:crosshair!important}[contenteditable="true"]:focus,.cursor-text:focus{cursor:text!important}</style><style data-stitch-scroll-lock="">html,body{overflow:hidden!important}</style></head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center">
<!-- TopAppBar -->
<header class="bg-surface flex items-center justify-between px-margin-mobile w-full h-16 shadow-sm sticky top-0 z-50">
<button class="text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined">close</span>
</button>
<h1 class="font-display text-headline-md text-on-surface">Goal Coach</h1>
<button class="text-primary hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined">more_vert</span>
</button>
</header>
<!-- Conversation Canvas -->
<main class="flex-1 w-full max-w-2xl px-margin-mobile pt-stack-lg pb-40 flex flex-col gap-stack-md">
<!-- User Bubble -->
<div class="flex justify-end w-full">
<div class="max-w-[85%] bg-primary-container text-on-primary-container px-stack-md py-stack-sm rounded-xl shadow-sm">
<p class="font-body-md text-body-md">I want to focus more on my creative projects.</p>
</div>
</div>
<!-- AI Bubble -->
<div class="flex justify-start w-full">
<div class="max-w-[85%] bg-surface-container-highest text-on-surface px-stack-md py-stack-sm rounded-xl shadow-sm">
<p class="font-body-md text-body-md">That sounds like a meaningful shift. Which creative domain feels most urgent right now?</p>
</div>
</div>
<!-- User Bubble -->
<div class="flex justify-end w-full">
<div class="max-w-[85%] bg-primary-container text-on-primary-container px-stack-md py-stack-sm rounded-xl shadow-sm">
<p class="font-body-md text-body-md">Probably music production. I have a lot of unfinished demos.</p>
</div>
</div>
<!-- AI Typing Indicator -->
<div class="flex justify-start w-full">
<div class="bg-surface-container-highest text-on-surface-variant px-stack-md py-3 rounded-xl flex gap-1 items-center">
<span class="w-1.5 h-1.5 bg-on-surface-variant rounded-full opacity-40"></span>
<span class="w-1.5 h-1.5 bg-on-surface-variant rounded-full opacity-70"></span>
<span class="w-1.5 h-1.5 bg-on-surface-variant rounded-full opacity-100"></span>
</div>
</div>
</main>
<!-- Input Bar (Analog Digital Style) -->
<div class="fixed bottom-0 w-full z-40 px-margin-mobile pb-8 bg-gradient-to-t from-background via-background to-transparent pointer-events-none pt-4">
<div class="max-w-2xl mx-auto flex items-center gap-3 pointer-events-auto w-full">
<div class="flex-1 bg-surface-container-low/80 backdrop-blur-md px-6 py-4 rounded-full border border-outline-variant/30 shadow-lg">
<textarea class="w-full bg-transparent border-none focus:ring-0 text-on-surface placeholder-on-surface-variant font-body-md text-body-md resize-none py-0 max-h-32 block" placeholder="Speak or type your goal..." rows="1"></textarea>
</div>
<button class="flex-shrink-0 w-14 h-14 bg-primary text-on-primary rounded-full flex items-center justify-center shadow-md hover:brightness-110 active:scale-95 transition-all">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">mic</span>
</button>
</div>
</div>
<!-- BottomNavBar (Suppressed for focused task, but kept as reference for shared component structure if it was a main screen) -->
<nav class="hidden fixed bottom-0 w-full z-50 flex justify-center items-center pb-8 px-margin-mobile pointer-events-none">
<div class="bg-surface/80 backdrop-blur-xl shadow-sm rounded-full mx-margin-mobile flex items-center justify-around w-full max-w-md h-16 pointer-events-auto">
<button class="text-on-surface-variant p-2 hover:text-primary transition-colors">
<span class="material-symbols-outlined">calendar_today</span>
</button>
<button class="bg-primary-container text-on-primary-container rounded-full p-2 active:scale-90 transition-all duration-200">
<span class="material-symbols-outlined" style='font-variation-settings: "FILL" 1;'>chat_bubble</span>
</button>
<button class="text-on-surface-variant p-2 hover:text-primary transition-colors">
<span class="material-symbols-outlined">auto_awesome</span>
</button>
<button class="text-on-surface-variant p-2 hover:text-primary transition-colors">
<span class="material-symbols-outlined">person</span>
</button>
</div>
</nav>
</body></html>
